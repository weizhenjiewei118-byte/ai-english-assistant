<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI英语学习助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">

    <!-- 顶部：标题 + 输入框 -->
    <header class="hero">
      <h1 class="title">
        <span class="title-icon">📘</span>
        AI英语学习助手
      </h1>
      <p class="subtitle">润色作文 · 解析长难句 · 生成记忆卡片，让英语学习更高效</p>
    </header>

    <main class="container">

      <!-- 输入区域 -->
      <section class="card input-card">
        <label class="card-label" for="inputText">✏️ 输入英文句子或单词</label>
        <textarea
          id="inputText"
          rows="5"
          placeholder="例如：The book which I bought yesterday is very interesting."></textarea>
      </section>

      <!-- 中部：三个功能按钮 -->
      <section class="actions">
        <button class="action-btn color-blue" data-action="polish">
          <span class="action-icon">✍️</span>
          <span class="action-name">润色作文</span>
          <span class="action-desc">语法纠错 · 表达升级</span>
        </button>
        <button class="action-btn color-teal" data-action="analyze">
          <span class="action-icon">🔍</span>
          <span class="action-name">解析长难句</span>
          <span class="action-desc">拆分结构 · 逐句翻译</span>
        </button>
        <button class="action-btn color-amber" data-action="flashcard">
          <span class="action-icon">🃏</span>
          <span class="action-name">生成记忆卡片</span>
          <span class="action-desc">单词释义 · 例句助记</span>
        </button>
      </section>

      <!-- 加载提示 -->
      <div id="loading" class="loading" hidden>
        <span class="spinner"></span>
        <span class="loading-text">AI 正在思考中，请稍候…</span>
      </div>

      <!-- 结果区域 -->
      <section id="resultCard" class="card result-card" hidden>
        <div class="result-header">
          <span id="resultTag" class="result-tag">结果</span>
          <button id="copyBtn" class="link-btn" type="button">📋 复制结果</button>
        </div>
        <div id="resultBody" class="result-body"></div>
      </section>

    </main>

    <!-- 底部：免责声明 -->
    <footer class="footer">
      <p>⚠️ 使用AI生成，仅供参考</p>
    </footer>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
